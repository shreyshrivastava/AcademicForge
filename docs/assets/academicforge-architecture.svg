<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AcademicForge architecture</title>
  <desc id="desc">An isometric architecture diagram showing the Streamlit frontend, FastAPI orchestration, hybrid retrieval, cache, local inference runtimes, and optional OpenJev quality reranking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111217"/>
      <stop offset="1" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3d47"/>
      <stop offset="1" stop-color="#20222a"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a4d57"/>
      <stop offset="1" stop-color="#282a32"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3941"/>
      <stop offset="1" stop-color="#a91622"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#000000" flood-opacity=".55"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#ff3941"/>
    </marker>
    <style>
      .label { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .small { font: 500 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #d7d8dd; }
      .dark { font: 700 24px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f3f3f4; }
      .muted { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #a5a7af; }
      .line { stroke: #ff3941; stroke-width: 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <path d="M90 770 L800 350 L1510 770 L800 890 Z" fill="#1a1c22" opacity=".9"/>
  <path d="M800 110 L800 350" stroke="#42444d" stroke-width="3" stroke-dasharray="10 12"/>
  <text x="90" y="92" class="dark" font-size="38">AcademicForge</text>
  <text x="90" y="128" class="muted">Question → papers → evidence → implementation plan</text>

  <g filter="url(#shadow)">
    <path d="M105 260 L350 135 L595 260 L350 385 Z" fill="#343740"/>
    <path d="M105 260 L105 390 L350 515 L350 385 Z" fill="#1e2027"/>
    <path d="M350 385 L595 260 L595 390 L350 515 Z" fill="#292b33"/>
    <text x="178" y="260" class="label">Streamlit UI</text>
    <text x="178" y="297" class="small">Search, selection, summaries</text>
    <text x="178" y="326" class="small">and combined roadmaps</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M630 260 L875 135 L1120 260 L875 385 Z" fill="url(#teal)"/>
    <path d="M630 260 L630 390 L875 515 L875 385 Z" fill="#202229"/>
    <path d="M875 385 L1120 260 L1120 390 L875 515 Z" fill="#2d3038"/>
    <text x="704" y="260" class="label">FastAPI</text>
    <text x="704" y="297" class="small">Orchestration and model</text>
    <text x="704" y="326" class="small">routing facade</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M1155 260 L1400 135 L1645 260 L1400 385 Z" fill="url(#gold)"/>
    <path d="M1155 260 L1155 390 L1400 515 L1400 385 Z" fill="#711923"/>
    <path d="M1400 385 L1645 260 L1645 390 L1400 515 Z" fill="#a51e2a"/>
    <text x="1220" y="260" class="label">Paper Sources</text>
    <text x="1220" y="297" class="small">arXiv + Semantic Scholar</text>
    <text x="1220" y="326" class="small">live candidate collection</text>
  </g>

  <path d="M595 325 L630 325" class="line"/>
  <path d="M1120 325 L1155 325" class="line"/>

  <g filter="url(#shadow)">
    <path d="M360 615 L605 490 L850 615 L605 740 Z" fill="url(#blue)"/>
    <path d="M360 615 L360 745 L605 870 L605 740 Z" fill="#1e2027"/>
    <path d="M605 740 L850 615 L850 745 L605 870 Z" fill="#292b33"/>
    <text x="414" y="610" class="label">Hybrid Retrieval</text>
    <text x="414" y="647" class="small">BM25 + dense BGE + RRF</text>
    <text x="414" y="676" class="small">cross-encoder reranker</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M900 615 L1145 490 L1390 615 L1145 740 Z" fill="url(#teal)"/>
    <path d="M900 615 L900 745 L1145 870 L1145 740 Z" fill="#202229"/>
    <path d="M1145 740 L1390 615 L1390 745 L1145 870 Z" fill="#2d3038"/>
    <text x="960" y="610" class="label">Inference Layer</text>
    <text x="960" y="647" class="small">MLX on Apple Silicon</text>
    <text x="960" y="676" class="small">Transformers on CUDA / ROCm</text>
  </g>

  <path d="M605 515 L605 570" class="line"/>
  <path d="M875 515 L875 560 L605 615" class="line"/>
  <path d="M1145 515 L1145 570" class="line"/>

  <g transform="translate(70 545)">
    <rect width="240" height="104" rx="16" fill="#1b1d23" stroke="#484b55" stroke-width="3"/>
    <text x="24" y="40" class="dark">Search cache</text>
    <text x="24" y="72" class="muted">Fast repeated queries</text>
  </g>
  <g transform="translate(1320 545)">
    <rect width="210" height="104" rx="16" fill="#1b1d23" stroke="#ff3941" stroke-width="3"/>
    <text x="24" y="40" class="dark">Quality Mode</text>
    <text x="24" y="72" class="muted">Optional OpenJev pass</text>
  </g>
  <path d="M310 597 L360 627" class="line"/>
  <path d="M1320 597 L1270 627" class="line"/>
</svg>
