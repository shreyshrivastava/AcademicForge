<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 900" role="img" aria-labelledby="title desc">
  <title id="title">AcademicForge architecture</title>
  <desc id="desc">An isometric architecture diagram showing the Streamlit frontend, FastAPI orchestration, default score-fusion retrieval, cache, local inference runtimes, and optional quality reranking.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0F15"/>
      <stop offset="1" stop-color="#090C11"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252B3B"/>
      <stop offset="1" stop-color="#181D28"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C3346"/>
      <stop offset="1" stop-color="#1B1F2B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ED1C24"/>
      <stop offset="1" stop-color="#C4151B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#07090D" flood-opacity=".55"/>
    </filter>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto">
      <path d="M0,2 L18,10 L0,18 Z" fill="#ED1C24"/>
    </marker>
    <style>
      .label { font: 700 26px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; }
      .small { font: 500 19px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #C9C9C7; }
      .dark { font: 700 24px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #F0F0EE; }
      .muted { font: 500 18px Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #A3A3A1; }
      .line { stroke: #ED1C24; stroke-width: 5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1700" height="900" fill="url(#bg)"/>
  <path d="M90 770 L800 350 L1510 770 L800 890 Z" fill="#0E1118" opacity=".9"/>
  <path d="M800 110 L800 350" stroke="#272D3E" stroke-width="3" stroke-dasharray="10 12"/>
  <text x="90" y="92" class="dark" font-size="38">Academic<tspan fill="#ED1C24">Forge</tspan></text>
  <text x="90" y="128" class="muted">Question → papers → evidence → implementation plan</text>

  <g filter="url(#shadow)">
    <path d="M105 260 L350 135 L595 260 L350 385 Z" fill="#222837"/>
    <path d="M105 260 L105 390 L350 515 L350 385 Z" fill="#131720"/>
    <path d="M350 385 L595 260 L595 390 L350 515 Z" fill="#1D222F"/>
    <text x="178" y="260" class="label">Streamlit UI</text>
    <text x="178" y="297" class="small">Search, selection, summaries</text>
    <text x="178" y="326" class="small">and combined roadmaps</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M630 260 L875 135 L1120 260 L875 385 Z" fill="url(#teal)"/>
    <path d="M630 260 L630 390 L875 515 L875 385 Z" fill="#161A24"/>
    <path d="M875 385 L1120 260 L1120 390 L875 515 Z" fill="#202533"/>
    <text x="704" y="260" class="label">FastAPI</text>
    <text x="704" y="297" class="small">Orchestration and model</text>
    <text x="704" y="326" class="small">routing facade</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M1155 260 L1400 135 L1645 260 L1400 385 Z" fill="url(#gold)"/>
    <path d="M1155 260 L1155 390 L1400 515 L1400 385 Z" fill="#7A1015"/>
    <path d="M1400 385 L1645 260 L1645 390 L1400 515 Z" fill="#B8141A"/>
    <text x="1220" y="260" class="label">Paper Sources</text>
    <text x="1220" y="297" class="small">arXiv + Semantic Scholar</text>
    <text x="1220" y="326" class="small">live candidate collection</text>
  </g>

  <path d="M595 325 L630 325" class="line"/>
  <path d="M1120 325 L1155 325" class="line"/>

  <g filter="url(#shadow)">
    <path d="M360 615 L605 490 L850 615 L605 740 Z" fill="url(#blue)"/>
    <path d="M360 615 L360 745 L605 870 L605 740 Z" fill="#131720"/>
    <path d="M605 740 L850 615 L850 745 L605 870 Z" fill="#1D222F"/>
    <text x="414" y="610" class="label">Score Fusion</text>
    <text x="414" y="647" class="small">Stemmed BM25 + dense BGE</text>
    <text x="414" y="676" class="small">alpha 0.9 · default mode</text>
  </g>

  <g filter="url(#shadow)">
    <path d="M900 615 L1145 490 L1390 615 L1145 740 Z" fill="url(#teal)"/>
    <path d="M900 615 L900 745 L1145 870 L1145 740 Z" fill="#161A24"/>
    <path d="M1145 740 L1390 615 L1390 745 L1145 870 Z" fill="#202533"/>
    <text x="960" y="610" class="label">Inference Layer</text>
    <text x="960" y="647" class="small">MLX on Apple Silicon</text>
    <text x="960" y="676" class="small">Transformers on CUDA / ROCm</text>
  </g>

  <path d="M605 515 L605 570" class="line"/>
  <path d="M875 515 L875 560 L605 615" class="line"/>
  <path d="M1145 515 L1145 570" class="line"/>

  <g transform="translate(70 545)">
    <rect width="240" height="104" rx="16" fill="#11141C" stroke="#2A3042" stroke-width="3"/>
    <text x="24" y="40" class="dark">Search cache</text>
    <text x="24" y="72" class="muted">Fast repeated queries</text>
  </g>
  <g transform="translate(1300 545)">
    <rect width="268" height="104" rx="16" fill="#11141C" stroke="#ED1C24" stroke-width="3"/>
    <text x="24" y="40" class="dark">Optional ranking</text>
    <text x="24" y="72" class="muted">RRF, reranker, OpenJev</text>
  </g>
  <path d="M310 597 L360 627" class="line"/>
  <path d="M1320 597 L1270 627" class="line"/>
</svg>
