name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ACADEMICFORGE_ENV_FILE: /nonexistent/academicforge-test.env
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.1'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked --extra local
      - run: uv run --no-sync ruff check backend frontend scripts tests benchmarks
      - run: uv run --no-sync python -m compileall -q backend frontend scripts tests benchmarks
      - run: bash -n start.sh
      - run: uv run --no-sync python -m scripts.download_weights --help
      - run: uv run --no-sync python -m pytest -q
      - run: uv pip check
