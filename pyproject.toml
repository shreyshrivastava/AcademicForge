[project]
name = "academicforge"
version = "0.2.0"
description = "Find research papers and turn selected evidence into a research plan"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.139,<0.140",
  "pydantic>=2.13,<3",
  "streamlit>=1.59,<1.60",
  "python-dotenv>=1.2,<2",
  "requests>=2.33,<3",
  "httpx>=0.28,<0.29",
  "uvicorn>=0.50,<0.51",
  "transformers>=5.13,<5.14",
  "accelerate>=1.14,<2",
  "numpy>=2.5,<3",
  "sentence-transformers>=5.6,<5.7",
  "huggingface-hub>=1.22,<2",
  "openai>=2.45,<3",
  "mlx==0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-metal==0.31.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "mlx-lm==0.31.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
local = ["torch==2.12.1"]

[dependency-groups]
dev = ["pytest>=9.1,<10", "ruff>=0.15,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: requires real models or hardware"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# Enforce correctness first; styling legacy UI/prompt code is a separate change.
select = ["E9", "F63", "F7", "F82"]
